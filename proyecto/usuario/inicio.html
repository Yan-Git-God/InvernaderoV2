<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invernadero - Inicio</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="../img/icon-192.png">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <script src="../js/datos.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/pwa.js"></script>
    <script>exigirRol("usuario")</script>
    <script defer src="../js/vendor/alpine.min.js"></script>
</head>
<body>

    <h1>Inicio</h1>

    <nav>
        <a href="inicio.html">Inicio</a>
        <a href="invernadero.html">Invernadero</a>
        <a href="creacion.html">Agregar</a>
        <a href="datos.html">Datos</a>
        <a href="../index.html" onclick="cerrarSesion()">Cerrar sesión</a>
    </nav>

    <main x-data="inicio()">

        <p>Hola, <span x-text="usuario.nombre"></span></p>

        <section>
            <h2>Resumen</h2>
            <p>Cultivos registrados: <span x-text="usuario.cultivos.length"></span></p>
            <p>Sensores registrados: <span x-text="usuario.sensores.length"></span></p>
            <p>Datos recolectados: <span x-text="usuario.lecturas.length"></span></p>
        </section>

        <section>
            <h2>Métricas de sensores</h2>

            <p x-cloak x-show="metricas.length === 0">Aún no tienes sensores registrados.</p>

            <div class="tabla-scroll" x-cloak x-show="metricas.length > 0">
                <table>
                    <thead>
                        <tr>
                            <th>Sensor</th>
                            <th>Último valor</th>
                            <th>Promedio</th>
                            <th>Mínimo</th>
                            <th>Máximo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="m in metricas" :key="m.nombre">
                            <tr>
                                <td x-text="m.nombre"></td>
                                <td x-text="m.ultimo"></td>
                                <td x-text="m.promedio"></td>
                                <td x-text="m.minimo"></td>
                                <td x-text="m.maximo"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        function inicio() {
            return {
                usuario: { nombre: "", cultivos: [], sensores: [], lecturas: [] },

                init() {
                    const actual = usuarioActual();
                    if (actual) {
                        this.usuario = actual;
                    }
                },

                get metricas() {
                    return this.usuario.sensores.map((sensor) => {
                        const lecturas = this.usuario.lecturas
                            .filter((l) => l.sensor === sensor.nombre)
                            .sort((a, b) => a.fecha.localeCompare(b.fecha));

                        if (lecturas.length === 0) {
                            return { nombre: sensor.nombre, ultimo: "-", promedio: "-", minimo: "-", maximo: "-" };
                        }

                        const valores = lecturas.map((l) => l.valor);
                        const suma = valores.reduce((a, b) => a + b, 0);
                        const promedio = (suma / valores.length).toFixed(1);

                        return {
                            nombre: sensor.nombre,
                            ultimo: valores[valores.length - 1] + " " + sensor.unidad,
                            promedio: promedio + " " + sensor.unidad,
                            minimo: Math.min(...valores) + " " + sensor.unidad,
                            maximo: Math.max(...valores) + " " + sensor.unidad
                        };
                    });
                }
            };
        }
    </script>

</body>
</html>
