<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invernadero - Crear cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="img/icon-192.png">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <script src="js/datos.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/pwa.js"></script>
    <script defer src="js/vendor/alpine.min.js"></script>
</head>
<body>

    <h1>Crear cuenta</h1>

    <form x-data="registro()" @submit.prevent="enviar()" novalidate>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" maxlength="60" x-model="nuevo.nombre" :class="{ 'campo-error': errores.nombre }">
        <p class="error" x-cloak x-show="errores.nombre" x-text="errores.nombre"></p>

        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" maxlength="20" x-model="nuevo.usuario" :class="{ 'campo-error': errores.usuario }">
        <p class="error" x-cloak x-show="errores.usuario" x-text="errores.usuario"></p>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" maxlength="30" x-model="nuevo.password" :class="{ 'campo-error': errores.password }">
        <p class="error" x-cloak x-show="errores.password" x-text="errores.password"></p>

        <label for="confirmacion">Repite la contraseña:</label>
        <input type="password" id="confirmacion" maxlength="30" x-model="nuevo.confirmacion" :class="{ 'campo-error': errores.confirmacion }">
        <p class="error" x-cloak x-show="errores.confirmacion" x-text="errores.confirmacion"></p>

        <button type="submit">Crear cuenta</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>

    <script>
        function registro() {
            return {
                nuevo: { nombre: "", usuario: "", password: "", confirmacion: "" },
                errores: {},

                init() {
                    const actual = usuarioActual();
                    if (actual) {
                        location.replace(rutaPanel(actual, ""));
                    }
                },

                validar(datos) {
                    const errores = {};
                    const nombre = this.nuevo.nombre.trim();
                    const usuario = this.nuevo.usuario.trim().toLowerCase();
                    const password = this.nuevo.password;

                    if (nombre === "") {
                        errores.nombre = "Ingresa tu nombre completo.";
                    }

                    if (usuario === "") {
                        errores.usuario = "Ingresa un nombre de usuario.";
                    } else if (usuario.length < 3) {
                        errores.usuario = "El usuario debe tener al menos 3 caracteres.";
                    } else if (!/^[a-z0-9_]+$/.test(usuario)) {
                        errores.usuario = "Usa solo letras, números o guion bajo.";
                    } else if (datos.usuarios.some((u) => u.usuario === usuario)) {
                        errores.usuario = "Ese nombre de usuario ya existe.";
                    }

                    if (password === "") {
                        errores.password = "Ingresa una contraseña.";
                    } else if (password.length < 6) {
                        errores.password = "La contraseña debe tener al menos 6 caracteres.";
                    }

                    if (this.nuevo.confirmacion === "") {
                        errores.confirmacion = "Repite la contraseña.";
                    } else if (this.nuevo.confirmacion !== password) {
                        errores.confirmacion = "Las contraseñas no coinciden.";
                    }

                    return errores;
                },

                enviar() {
                    const datos = cargarDatos();
                    this.errores = this.validar(datos);
                    if (Object.keys(this.errores).length > 0) {
                        return;
                    }

                    const usuario = this.nuevo.usuario.trim().toLowerCase();
                    datos.usuarios.push({
                        id: siguienteId(datos.usuarios),
                        usuario: usuario,
                        password: this.nuevo.password,
                        nombre: this.nuevo.nombre.trim(),
                        rol: "usuario",
                        cultivos: [],
                        sensores: [],
                        lecturas: []
                    });
                    guardarDatos(datos);

                    const creado = iniciarSesion(usuario, this.nuevo.password);
                    location.href = rutaPanel(creado, "");
                }
            };
        }
    </script>

</body>
</html>
