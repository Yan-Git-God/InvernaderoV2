<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invernadero - Invernaderos Globales</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="../img/icon-192.png">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <script src="../js/datos.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/pwa.js"></script>
    <script>exigirRol("admin")</script>
    <script defer src="../js/vendor/alpine.min.js"></script>
</head>
<body>

    <h1>Invernaderos Globales</h1>

    <nav>
        <a href="inicio.html">Inicio</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="invernaderos.html">Invernaderos Globales</a>
        <a href="../index.html" onclick="cerrarSesion()">Cerrar sesión</a>
    </nav>

    <main x-data="invernaderosGlobales()">

        <label for="filtroUsuario">Filtrar por usuario:</label>
        <select id="filtroUsuario" x-model="filtroUsuario">
            <option value="todos">Todos</option>
            <template x-for="u in usuarios" :key="u.id">
                <option :value="u.id" x-text="u.nombre"></option>
            </template>
        </select>

        <p x-cloak x-show="usuariosMostrados.length === 0">No hay usuarios registrados.</p>

        <template x-for="u in usuariosMostrados" :key="u.id">
            <section>
                <h2 x-text="u.nombre"></h2>

                <h3>Cultivos</h3>
                <p x-cloak x-show="u.cultivos.length === 0">Este invernadero no tiene cultivos.</p>
                <div class="tabla-scroll" x-show="u.cultivos.length > 0">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Fecha de cultivo</th>
                                <th>Estacional</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="c in u.cultivos" :key="c.id">
                                <tr>
                                    <td x-text="c.nombre"></td>
                                    <td x-text="c.tipo"></td>
                                    <td x-text="formatoFecha(c.fecha)"></td>
                                    <td x-text="c.estacional ? 'Sí' : 'No'"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <h3>Sensores</h3>
                <p x-cloak x-show="u.sensores.length === 0">Este invernadero no tiene sensores.</p>
                <div class="tabla-scroll" x-show="u.sensores.length > 0">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Unidad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="s in u.sensores" :key="s.id">
                                <tr>
                                    <td x-text="s.nombre"></td>
                                    <td x-text="s.descripcion"></td>
                                    <td x-text="s.unidad"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </section>
        </template>

    </main>

    <script>
        function invernaderosGlobales() {
            return {
                usuarios: [],
                filtroUsuario: "todos",

                init() {
                    this.usuarios = cargarDatos().usuarios.filter((u) => u.rol === "usuario");
                    const id = new URLSearchParams(location.search).get("usuario");
                    if (id && this.usuarios.some((u) => String(u.id) === id)) {
                        this.filtroUsuario = id;
                    }
                },

                get usuariosMostrados() {
                    if (this.filtroUsuario === "todos") {
                        return this.usuarios;
                    }
                    return this.usuarios.filter((u) => String(u.id) === String(this.filtroUsuario));
                },

                formatoFecha(fecha) {
                    const partes = fecha.split("-");
                    return partes[2] + "/" + partes[1] + "/" + partes[0];
                }
            };
        }
    </script>

</body>
</html>
