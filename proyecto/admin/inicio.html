<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invernadero - Admin Inicio</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="../img/icon-192.png">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <script src="../js/datos.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/pwa.js"></script>
    <script>exigirRol("admin")</script>
    <script defer src="../js/vendor/alpine.min.js"></script>
</head>
<body>

    <h1>Inicio (Administrador)</h1>

    <nav>
        <a href="inicio.html">Inicio</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="invernaderos.html">Invernaderos Globales</a>
        <a href="../index.html" onclick="cerrarSesion()">Cerrar sesión</a>
    </nav>

    <main x-data="inicioAdmin()">

        <p>Hola, <span x-text="nombre"></span></p>

        <section>
            <h2>Resumen global</h2>
            <p>Usuarios registrados: <span x-text="usuarios.length"></span></p>
            <p>Invernaderos: <span x-text="usuarios.length"></span></p>
            <p>Cultivos totales: <span x-text="totalCultivos"></span></p>
            <p>Sensores totales: <span x-text="totalSensores"></span></p>
            <p>Datos recolectados: <span x-text="totalLecturas"></span></p>
        </section>

    </main>

    <script>
        function inicioAdmin() {
            return {
                nombre: "",
                usuarios: [],

                init() {
                    const actual = usuarioActual();
                    if (!actual) {
                        return;
                    }
                    this.nombre = actual.nombre;
                    this.usuarios = cargarDatos().usuarios.filter((u) => u.rol === "usuario");
                },

                get totalCultivos() {
                    return this.usuarios.reduce((total, u) => total + u.cultivos.length, 0);
                },

                get totalSensores() {
                    return this.usuarios.reduce((total, u) => total + u.sensores.length, 0);
                },

                get totalLecturas() {
                    return this.usuarios.reduce((total, u) => total + u.lecturas.length, 0);
                }
            };
        }
    </script>

</body>
</html>
