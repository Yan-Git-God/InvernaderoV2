<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invernadero - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/datos.js"></script>
    <script src="js/sesion.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>

    <h1>Sistema de Invernadero</h1>

    <form x-data="login()" @submit.prevent="enviar()" novalidate>
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" x-model="usuario" :class="{ 'campo-error': errores.usuario }">
        <p class="error" x-cloak x-show="errores.usuario" x-text="errores.usuario"></p>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" x-model="password" :class="{ 'campo-error': errores.password }">
        <p class="error" x-cloak x-show="errores.password" x-text="errores.password"></p>

        <p class="error" x-cloak x-show="errorGeneral" x-text="errorGeneral"></p>

        <button type="submit">Ingresar</button>
    </form>

    <section>
        <h2>Usuarios de prueba</h2>
        <ul>
            <li>Administrador: admin / admin123</li>
            <li>Usuario con datos: juan / juan123</li>
            <li>Usuario con datos: maria / maria123</li>
            <li>Usuario con invernadero vacío: pedro / pedro123</li>
        </ul>
    </section>

    <script>
        function login() {
            return {
                usuario: "",
                password: "",
                errores: {},
                errorGeneral: "",

                init() {
                    const actual = usuarioActual();
                    if (actual) {
                        location.replace(rutaPanel(actual, ""));
                    }
                },

                enviar() {
                    this.errores = {};
                    this.errorGeneral = "";

                    const usuario = this.usuario.trim();
                    if (usuario === "") {
                        this.errores.usuario = "Ingresa tu usuario.";
                    }
                    if (this.password.trim() === "") {
                        this.errores.password = "Ingresa tu contraseña.";
                    }
                    if (Object.keys(this.errores).length > 0) {
                        return;
                    }

                    const encontrado = iniciarSesion(usuario, this.password);
                    if (!encontrado) {
                        this.errorGeneral = "Usuario o contraseña incorrectos.";
                        return;
                    }
                    location.href = rutaPanel(encontrado, "");
                }
            };
        }
    </script>

</body>
</html>
